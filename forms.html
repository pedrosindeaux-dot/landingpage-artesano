<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
    <div id="google-form">
        <h1>Google Form</h1>
        <form action="https://google.com/search">
            <input type="text" name="q" placeholder="Digite Aqui"/> <!--bloco para texto, o placeholder aparece o texto clarinho na caixa do texto-->
            <input type="submit" value="Pesquisar"/>  <!--botão de enviar-->
            <!-- <button>Enviar</button>   opção extra de adicionar um botão -->

        </form>
    </div>
    
</body>
</html>
